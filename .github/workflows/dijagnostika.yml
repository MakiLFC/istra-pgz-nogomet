# Dijagnostika kartona, samo ručno.
#
# ČEMU SLUŽI
# Kad se lista kartona iz zapisnika razilazi s onom sa stranice
# natjecanja, ovaj posao za zadana imena prođe kroz zapisnike njihovih
# klubova i ispiše svaki događaj uz tog igrača. Iz ispisa se vidi je li
# karton uopće u zapisniku, stoji li uz igrača koji u postavi nije
# naveden, ili se ime piše drukčije.
#
# KAKO SE POKREĆE
# Actions -> "Dijagnostika kartona" -> Run workflow, pa u polje "igraci"
# upiši imena odvojena točka-zarezom, npr.:
#   Doni Tanković;Ivan Rojnić;Admir Haznadar;Bakir Delić
# Polje "natjecanje" se smije ostaviti prazno, tad ide kroz sve četiri
# lige.
#
# NE DIRA BAZU. Samo čita Semafor i ispisuje, pa se smije pokretati kad
# god zatreba. Traje koliko i nekoliko zapisnika, dakle manje od minute
# po igraču.

name: Dijagnostika kartona

on:
  workflow_dispatch:
    inputs:
      igraci:
        description: "Imena igrača, odvojena točka-zarezom"
        required: true
        type: string
      natjecanje:
        description: "Dio naziva lige (prazno = sve četiri)"
        required: false
        type: string
      html:
        description: "Ispiši i sirovi HTML redaka postave (sporije)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dijagnostika:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v7

      - name: Postavi Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instaliraj pakete
        run: pip install -r requirements.txt

      - name: Pokreni dijagnostiku
        # Vrijednosti idu kroz okolinu, ne kroz naredbeni redak, da ime s
        # navodnikom ili razmakom ne može razbiti naredbu.
        env:
          IGRACI: ${{ inputs.igraci }}
          NATJECANJE: ${{ inputs.natjecanje }}
          HTML: ${{ inputs.html && '1' || '' }}
        run: python dijagnostika_kartoni.py

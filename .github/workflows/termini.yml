# Dnevna provjera termina (samo raspored, bez zapisnika).
#
# ČEMU SLUŽI
# Glavni scraper (scraper.yml) ide vikendom, ponedjeljkom i srijedom, i
# svaki put prođe kroz sve zapisnike, što traje dvadesetak minuta. Termini
# se, međutim, mijenjaju bilo kojeg dana: NK Žminj - NK Ližnjan premješten
# je s 05.09. na 04.09.2026., a takvu bi promjenu glavni scraper vidio tek
# u subotu navečer, dakle nakon utakmice.
#
# Ovaj posao zato svaki dan, ujutro i popodne, pročita SAMO retke rasporeda
# (četiri stranice, nekoliko sekundi) i osvježi datum, vrijeme i stadion.
# Rezultati, postave i rang-liste se ne diraju.
#
# ŠTO SE DOGODI KAD SE TERMIN PROMIJENI
# Stranica se ažurira sama. Uz to se otvara issue na GitHubu s popisom
# premještenih utakmica, pa o promjeni stigne poruka e-poštom i vidi se
# treba li ispraviti najavu kola. Ako promjena nema, ne događa se ništa.
#
# RUČNO POKRETANJE: repo -> Actions -> "Provjera termina" -> Run workflow.
# Korisno kad se sazna da je utakmica premještena, a ne čeka se sljedeći
# redoviti prolaz.
#
# KVAČICA "Obriši i utakmice kojih na rasporedu više nema"
# Utakmice koje su u bazi, a HNS ih na rasporedu ne pokazuje, redovito se
# samo prijavljuju, jer bi jedno loše pročitano čitanje stranice inače
# obrisalo cijelu ligu. Kad se u prijavi vidi da im u bazi doista nije
# mjesto (npr. HNS je presložio parove, pa je stari zapis ostao kao duh),
# pokrene se ovaj posao s uključenom kvačicom i oni se obrišu. Nikad se ne
# briše utakmica koja ima rezultat. Dnevna pokretanja ovo NIKAD ne rade.

name: Provjera termina

on:
  # ZAKAZANA POKRETANJA SU UGAŠENA 11.11.2026., privremeno.
  #
  # Od 10.11.2026. Semafor je iza Cloudflareove zaštite od robota: svaki
  # dohvat s GitHuba vraća 403, a u odgovoru stoji "cf-mitigated: challenge"
  # i stranica "Just a moment...". To je međuekran koji rješava JavaScript
  # u pregledniku, pa ga scraper ne može proći. Provjereno poslom
  # "Zašto 403" (alati/dijagnostika_403.py): padaju svi oblici zahtjeva
  # jednako, i onaj koji izgleda kao pravi Chrome.
  #
  # Dok je tako, ovaj posao ne može ništa osvježiti, a svako pokretanje
  # šalje dvanaest zahtjeva u njihovu zaštitu i Andreju mail o padu. Zato
  # su cron retci zakomentirani, a ručno pokretanje je ostavljeno, da se
  # jednim klikom provjeri je li zaštita popustila.
  #
  # VRAĆA SE tako da se maknu znakovi komentara s dva retka ispod, čim HNS
  # propusti naš dohvat. Glavni scraper (scraper.yml) NIJE diran: on ide
  # vikendom i ponedjeljkom, i ako ostane crven, to je znak da ovo još
  # traje.
  # schedule:
  #   # GitHub cron radi u UTC vremenu (ljeti +2 sata za hrvatsko vrijeme).
  #   - cron: "0 5 * * *"    # svaki dan ujutro
  #   - cron: "0 15 * * *"   # svaki dan poslijepodne
  workflow_dispatch:
    inputs:
      obrisi_nestale:
        description: "Obriši i utakmice kojih na rasporedu više nema (samo one bez rezultata)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write            # potrebno za obavijest o promjeni termina

jobs:
  termini:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v7

      - name: Postavi Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instaliraj pakete
        run: pip install -r requirements.txt

      - name: Osvježi termine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scraper_supabase.py --samo-raspored \
            ${{ inputs.obrisi_nestale && '--obrisi-nestale' || '' }} \
            --izvjestaj-promjena promjene_termina.txt

      - name: Javi ako je koja utakmica premještena
        if: hashFiles('promjene_termina.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Promjena termina ($(date +%d.%m.%Y.))" \
            --body-file promjene_termina.txt

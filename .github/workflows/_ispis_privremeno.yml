# PRIVREMENO. Brise se cim ispis prodje.
#
# Posao "Ispis kola" se pokrece gumbom, a GitHub gumb nudi samo za
# poslove koji vec stoje na grani main. Dok ovaj nije ondje, jedini
# nacin da se pokrene sa radne grane je okidac na push.
#
# Radi tocno ono isto sto i ispis_kola.yml, samo za 3. NL i 5. kolo.
# Ne dira bazu.

name: Ispis kola (privremeno)

on:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/_ispis_privremeno.yml"

permissions:
  contents: read

jobs:
  ispis:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v7

      - name: Postavi Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instaliraj pakete
        run: pip install -r requirements.txt

      - name: Procitaj ligu sa Semafora
        run: |
          python scraper_supabase.py --dry-run --json liga.json \
            --natjecanje "3. NL"

      - name: Ispisi kolo
        run: python alati/ispis_kola.py liga.json 5

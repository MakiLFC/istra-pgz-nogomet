# Automatsko pokretanje scrapera vikendom.
# GitHub sam pokrene scraper subotom i nedjeljom navečer - tvoje računalo
# ne mora biti upaljeno. Rezultati idu direktno u Supabase.
#
# POSTAVLJANJE (jednokratno):
# 1. Ovu datoteku stavi u repo na TOČNO ovu putanju: .github/workflows/scraper.yml
# 2. Na GitHubu: repo -> Settings -> Secrets and variables -> Actions
#    -> New repository secret, pa dodaj DVA secreta (imena točno ovako):
#       SUPABASE_URL          = (vrijednost iz tvoje .env datoteke)
#       SUPABASE_SERVICE_KEY  = (vrijednost iz tvoje .env datoteke)
# 3. Ako scraper_supabase.py NIJE u korijenu repozitorija nego u podmapi
#    (npr. "scraper/"), promijeni zadnju liniju u:
#       run: python scraper/scraper_supabase.py
#
# RUČNO POKRETANJE: repo -> Actions -> "Scraper HNS Semafor" -> Run workflow.
#
# SAMO TERMINI: ovaj posao svaki put prođe i kroz sve zapisnike, pa traje
# dvadesetak minuta po ligi. Kad treba samo osvježiti datume i vremena
# (npr. čim se sazna da je utakmica premještena), brži je posao
# "Provjera termina" (.github/workflows/termini.yml), koji čita samo
# retke rasporeda i gotov je za nekoliko sekundi.

name: Scraper HNS Semafor

on:
  schedule:
    # GitHub cron radi u UTC vremenu!
    # 19:00 UTC = 20:00 zimi / 21:00 ljeti po hrvatskom vremenu.
    #
    # ZASTO DVA VECERNJA PROLAZA, RANI I KASNI
    # Izmjereno 05. i 06.09.2026.: zapisnici na HNS-u budu gotovi otprilike
    # sat do sat i pol nakon zadnjeg zvizduka. Utakmice pocinju u 17:00 ili
    # 17:30, dakle podaci su dostupni vec oko 20 do 20:30 po nasem.
    # Zakazani poslovi na GitHubu pritom kasne jedan do tri sata (vidi
    # CLAUDE.md), pa je prolaz zakazan za 21:00 stvarno isao izmedju 22 i
    # 24 sata, dva do tri sata nakon sto su podaci bili spremni.
    #
    # Zato rani prolaz ide u 17:00 UTC (19:00 po nasem): s uobicajenim
    # kasnjenjem padne izmedju 20 i 22 sata, dakle taman. Kasni ostaje kao
    # mreza, za ono sto HNS naknadno dopuni.
    #
    # Dva prolaza ne smetaju: sve ide preko istog retka u bazi. Ako rani
    # jednom krene tocno na vrijeme i zatekne utakmice jos u tijeku,
    # procitat ce sto postoji, a kasni dopuni ostalo. Rezultat koji je vec
    # u bazi ne moze se izgubiti: kad se rezultat ne procita, stupac se ne
    # salje u upsert (vidi test_rezultat_bez_brojki.py).
    #
    # Kad kolovoska i rujanska satnica ustupi mjesto studenskoj (utakmice
    # u 13:30), rani prolaz smije ici jos ranije, jer podaci budu gotovi
    # vec oko 16 sati po nasem.
    - cron: "0 17 * * 6"   # subota, rani
    - cron: "0 19 * * 6"   # subota, kasni
    - cron: "0 17 * * 0"   # nedjelja, rani
    - cron: "0 19 * * 0"   # nedjelja, kasni
    - cron: "0 6 * * 1"    # ponedjeljak ujutro (sigurnosna runda za kasno
                           # unesene rezultate i nedjeljne večernje utakmice)
    - cron: "0 18 * * 5"   # petak, rani
    - cron: "0 20 * * 5"   # petak, kasni (od ove sezone se dio kola igra
                           # u petak: 3. NL Zapad ima petkom po jednu
                           # utakmicu, a 04.09.2026. i 4. NL otvara kolo
                           # susretom Žminj - Ližnjan. Bez ove runde takav
                           # bi rezultat čekao subotu navečer. 20:00 UTC je
                           # 22:00 po hrvatskom, dakle oko dva i pol sata
                           # nakon kraja utakmice u 17:30.)
    - cron: "0 17 * * 3"   # srijeda, rani
    - cron: "0 19 * * 3"   # srijeda, kasni (odgođene i sredinom tjedna
                           # zakazane utakmice; npr. 1. ŽNL PGŽ ima
                           # Omladinac Vrata - Vrbovsko u srijedu 09.09.2026.
                           # Bez ove runde takav bi rezultat čekao subotu.)
  workflow_dispatch: {}     # omogućuje ručno pokretanje gumbom na GitHubu

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Gornja granica trajanja. Krajem prošle sezone, s četiri lige i punim
    # zapisnicima, prolaz je trajao 19 do 22 minute (svaki zapisnik je jedan
    # dohvat plus sekunda pauze prema HNS-u). Uz 30 minuta razlika je bila
    # premala: jedan spor dan i GitHub bi prekinuo posao usred zadnje lige.
    timeout-minutes: 45

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v7

      - name: Postavi Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instaliraj pakete
        run: pip install -r requirements.txt

      - name: Pokreni scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper_supabase.py

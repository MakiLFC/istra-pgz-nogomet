<!doctype html><html lang="hr"><head><meta charset="utf-8">
<style>
@font-face{font-family:PD;font-style:italic;src:url("fonts/playfair-display-latin-400-italic.woff2") format("woff2");unicode-range:U+0000-00FF}
@font-face{font-family:PD;font-style:italic;src:url("fonts/playfair-display-latin-ext-400-italic.woff2") format("woff2");unicode-range:U+0100-024F}
html,body{margin:0;background:#0d3b40}
.z{width:1200px;padding:40px 30px;display:grid;grid-template-columns:repeat(8,1fr);gap:28px 10px;
  background:linear-gradient(160deg,#12474d 0%,#0d3b40 42%,#092d32 78%,#062327 100%)}
.k{display:flex;flex-direction:column;align-items:center;gap:10px}
.k svg{width:104px;height:120px;filter:drop-shadow(0 4px 8px rgba(2,14,16,.55))}
.k span{font-family:PD;font-style:italic;font-size:17px;color:#eef3ec;text-align:center}
</style><script src="grbovi.js"></script></head><body><div class="z" id="z"></div>
<script>
window.slozi = (klubovi) => {
  document.getElementById('z').innerHTML = Object.entries(klubovi).map(([ime, c]) =>
    `<div class="k">${znakKluba(c)}<span>${ime}</span></div>`).join('');
};
</script></body></html>

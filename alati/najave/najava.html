<!doctype html>
<html lang="hr"><head><meta charset="utf-8">
<style>
@font-face{font-family:AR;font-weight:800;src:url("fonts/archivo-latin-800-normal.woff2") format("woff2");unicode-range:U+0000-00FF}
@font-face{font-family:AR;font-weight:800;src:url("fonts/archivo-latin-ext-800-normal.woff2") format("woff2");unicode-range:U+0100-024F}
@font-face{font-family:IN;font-weight:400;src:url("fonts/inter-latin-400-normal.woff2") format("woff2");unicode-range:U+0000-00FF}
@font-face{font-family:IN;font-weight:400;src:url("fonts/inter-latin-ext-400-normal.woff2") format("woff2");unicode-range:U+0100-024F}
@font-face{font-family:IN;font-weight:700;src:url("fonts/inter-latin-700-normal.woff2") format("woff2");unicode-range:U+0000-00FF}
@font-face{font-family:IN;font-weight:700;src:url("fonts/inter-latin-ext-700-normal.woff2") format("woff2");unicode-range:U+0100-024F}
@font-face{font-family:JB;font-weight:400;src:url("fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:JB;font-weight:700;src:url("fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:PD;font-weight:400;font-style:italic;src:url("fonts/playfair-display-latin-400-italic.woff2") format("woff2");unicode-range:U+0000-00FF}
@font-face{font-family:PD;font-weight:400;font-style:italic;src:url("fonts/playfair-display-latin-ext-400-italic.woff2") format("woff2");unicode-range:U+0100-024F}

:root{--pitch:#0d3b40;--chalk:#dde2db;--oxide:#b5502a;--oxide-l:#e08a55;--zut:#e8c547}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#04191d}
.z{position:relative;width:1200px;height:630px;overflow:hidden}
.rub{position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--oxide);z-index:6}
.potpis{position:absolute;left:64px;bottom:32px;font-family:IN;font-weight:700;font-size:10.5px;
  letter-spacing:.34em;color:#6f8688;z-index:6}
.brojka{position:absolute;right:64px;bottom:32px;font-family:JB;font-weight:400;font-size:11px;
  letter-spacing:.1em;color:#6f8688;z-index:6}
.crta{width:44px;height:3px;background:var(--oxide);margin-bottom:15px}
.oznaka{font-family:IN;font-weight:700;font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;
  color:#8ea2a3;margin-bottom:11px}

/* ============================ A. PLOCA KOLA ============================ */
.ploca{background:linear-gradient(160deg,#12474d 0%,#0d3b40 42%,#092d32 78%,#062327 100%)}
.ploca .trake{position:absolute;inset:0;opacity:.055;
  background:repeating-linear-gradient(90deg,#dde2db 0 1px,transparent 1px 84px)}
.ploca .luk{position:absolute;right:-190px;top:-230px;width:760px;height:760px;border-radius:50%;
  border:2px solid rgba(221,226,219,.075)}
.ploca .luk2{position:absolute;left:-140px;bottom:-300px;width:560px;height:560px;border-radius:50%;
  border:2px solid rgba(221,226,219,.05)}
.glava{position:absolute;left:64px;right:64px;top:50px;display:flex;align-items:flex-end;
  justify-content:space-between;z-index:5}
.naslov{font-family:AR;font-weight:800;font-size:54px;line-height:.98;letter-spacing:-.022em;
  text-transform:uppercase;color:#f4f7f4}
.naslov i{font-family:PD;font-weight:400;font-style:italic;text-transform:none;letter-spacing:0;
  color:var(--oxide-l);font-size:56px}
.termin{text-align:right;padding-bottom:6px}
.termin .dan{font-family:JB;font-weight:700;font-size:22px;letter-spacing:.02em;color:#f4f7f4}
.termin .sat{font-family:IN;font-weight:700;font-size:10.5px;letter-spacing:.2em;color:#8ea2a3;margin-top:9px}
.crtaH{position:absolute;left:64px;right:64px;top:208px;height:1px;background:rgba(221,226,219,.14);z-index:5}

.popis{position:absolute;left:64px;right:64px;top:230px;height:336px;display:grid;
  grid-template-rows:repeat(4,1fr);grid-auto-flow:column;grid-auto-columns:1fr;z-index:5}
.par{position:relative;display:flex;align-items:center;padding:0 14px;
  border-bottom:1px solid rgba(221,226,219,.09)}
.par:nth-child(4){border-bottom:0}
.par:last-child{border-bottom:0}
.par:nth-child(-n+4){border-right:1px solid rgba(221,226,219,.09)}
.par.derbi{background:linear-gradient(90deg,rgba(232,197,71,.10) 0%,rgba(232,197,71,.03) 60%,transparent 100%);
  box-shadow:inset 3px 0 0 var(--zut)}
.ime{font-family:PD;font-weight:400;font-style:italic;font-size:23px;line-height:1;
  color:#eef3ec;white-space:nowrap}
.ime.d{flex:1;text-align:right;padding-right:18px}
.ime.g{flex:1;text-align:left;padding-left:18px}
.par.derbi .ime{color:#f7e5b4}
.vs{flex:0 0 34px;text-align:center;font-family:JB;font-weight:700;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--oxide-l)}
.par.derbi .vs{color:var(--zut)}
.znak{position:absolute;left:50%;transform:translateX(-50%);top:12px;font-family:IN;font-weight:700;
  font-size:8px;letter-spacing:.2em;padding:2px 7px;background:var(--zut);color:#0b3338}

/* ============================ B. HORIZONT KOLA ============================ */
.horizont{background:linear-gradient(180deg,#184b50 0%,#124046 34%,#0b3035 58%,#072429 76%,#04191d 100%)}
.horizont .zar{position:absolute;inset:0;
  background:radial-gradient(circle at 82% 38%,rgba(200,98,44,.30) 0%,rgba(200,98,44,.10) 24%,transparent 50%)}
.horizont .tekstura{position:absolute;left:0;right:0;top:0;height:70%;opacity:.05;
  background-image:repeating-linear-gradient(38deg,#cfe0dd 0 1px,transparent 1px 26px),
                   repeating-linear-gradient(-38deg,#cfe0dd 0 1px,transparent 1px 26px)}
.horizont .duhH{position:absolute;left:46%;top:-14px;font-family:PD;font-style:italic;font-size:340px;
  line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(214,231,228,.062)}
svg.scena{position:absolute;inset:0;width:100%;height:100%}
.crtice{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.more{position:absolute;left:0;right:0;top:468px;bottom:0;
  background:linear-gradient(180deg,#062226 0%,#04191d 55%,#031215 100%)}
.tekstH{position:absolute;left:72px;top:92px;z-index:5}
.naslovH{font-family:AR;font-weight:800;font-size:50px;line-height:1;letter-spacing:-.02em;
  text-transform:uppercase;color:#f4f7f4;text-shadow:0 3px 16px rgba(2,14,16,.85)}
.naslovH i{font-family:PD;font-weight:400;font-style:italic;text-transform:none;letter-spacing:0;
  font-size:54px;color:#f4d9c4}
.podH{font-family:IN;font-weight:400;font-size:13.5px;color:#a9bab8;margin-top:14px;
  text-shadow:0 1px 6px rgba(2,14,16,.8)}
.terminH{font-family:JB;font-weight:700;font-size:15px;letter-spacing:.05em;color:#e7eee7;margin-top:20px}
.pojas{position:absolute;left:0;right:0;bottom:74px;z-index:5;text-align:center}
.pojas .naslovic{font-family:IN;font-weight:700;font-size:10px;letter-spacing:.3em;color:#7d9496;
  margin-bottom:15px;text-transform:uppercase}
.chips{display:flex;justify-content:center;gap:9px}
.chip{width:52px;height:52px;display:flex;align-items:center;justify-content:center;
  font-family:AR;font-weight:800;font-size:12.5px;color:#eaf1ea;background:rgba(11,51,56,.86);
  border:1px solid rgba(221,226,219,.16);box-shadow:0 2px 10px rgba(2,14,16,.5)}
.chip.derbi{border-color:var(--zut);color:#f7e9b0;background:rgba(48,44,18,.86)}
</style></head><body>
<div class="z" id="z"></div>
<script>
function greben(H, bazaU, visinaU, korak){
  const baza = H * bazaU, visina = H * visinaU, t = [];
  for (let x = -60, i = 0; x <= 1260; x += korak, i++){
    const v = baza - (i % 2 ? visina : visina * 0.42) - ((i % 3) * H * 0.018);
    t.push(x + ',' + v.toFixed(1));
  }
  return `-60,${H} ` + t.join(' ') + ` 1260,${H}`;
}
function valovi(){
  let t = '<g stroke="#2b4f52" stroke-width="1.4" stroke-linecap="round">';
  for (let i = 0; i < 110; i++){
    const y = 10 + (i * 37) % 150, x = (i * 137) % 1160, w = 18 + (i * 29) % 74;
    t += `<line x1="${x}" y1="${y}" x2="${x + w}" y2="${y}" opacity="${(0.10 + (i % 5) * 0.045).toFixed(2)}"/>`;
  }
  return t + '</g>';
}
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function ploca(k){
  const parovi = k.utakmice.map(u => `
    <div class="par${u.derbi ? ' derbi' : ''}">
      <span class="ime d">${esc(u.d)}</span>
      <span class="vs">vs</span>
      <span class="ime g">${esc(u.g)}</span>
      ${u.derbi ? '<span class="znak">DERBI KOLA</span>' : ''}
    </div>`).join('');
  return `
  <div class="ploca" style="position:absolute;inset:0">
    <div class="trake"></div><div class="luk"></div><div class="luk2"></div>
    <div class="glava">
      <div>
        <div class="crta"></div>
        <div class="oznaka">${esc(k.oznaka)}</div>
        <div class="naslov">Najava <i>${esc(k.kolo)}. kola</i></div>
      </div>
      <div class="termin">
        <div class="dan">${esc(k.datum)}</div>
        <div class="sat">${esc(k.sat)}</div>
      </div>
    </div>
    <div class="crtaH"></div>
    <div class="popis">${parovi}</div>
    <div class="potpis">LOKAL-ARENA</div>
    <div class="brojka">${k.utakmice.length} utakmica &middot; ${k.utakmice.length * 2} klubova</div>
    <div class="rub"></div>
  </div>`;
}

function horizont(k){
  const H = 630;
  const chips = k.utakmice.flatMap(u => [
    {k:u.dk, derbi:u.derbi}, {k:u.gk, derbi:u.derbi}
  ]).map(c => `<div class="chip${c.derbi ? ' derbi' : ''}">${esc(c.k)}</div>`).join('');
  return `
  <div class="horizont" style="position:absolute;inset:0">
    <div class="zar"></div><div class="tekstura"></div>
    <div class="duhH">${esc(k.kolo)}</div>
    <svg class="scena" viewBox="0 0 1200 ${H}" preserveAspectRatio="none">
      <ellipse cx="1002" cy="${(H*0.335).toFixed(1)}" rx="54" ry="54" fill="#c8622c"/>
      <polygon points="${greben(H,0.660,0.096,150)}" fill="#17494e"/>
      <polygon points="${greben(H,0.700,0.078,122)}" fill="#123c42"/>
      <polygon points="${greben(H,0.735,0.058,98)}" fill="#0d3035"/>
      <polygon points="${greben(H,0.762,0.040,78)}" fill="#0a262b"/>
    </svg>
    <div class="more"><svg class="crtice" viewBox="0 0 1200 162" preserveAspectRatio="none">${valovi()}</svg></div>
    <div class="tekstH">
      <div class="crta"></div>
      <div class="oznaka">${esc(k.oznaka)}</div>
      <div class="naslovH">Najava <i>${esc(k.kolo)}. kola</i></div>
      <div class="podH">${esc(k.podnaslov)}</div>
      <div class="terminH">${esc(k.datum)} &middot; ${esc(k.sat)}</div>
    </div>
    <div class="pojas">
      <div class="naslovic">Klubovi ${esc(k.kolo)}. kola</div>
      <div class="chips">${chips}</div>
    </div>
    <div class="potpis">LOKAL-ARENA</div>
    <div class="rub"></div>
  </div>`;
}

window.slozi = (k) => {
  document.getElementById('z').innerHTML = k.stil === 'horizont' ? horizont(k) : ploca(k);
};
</script>
</body></html>
